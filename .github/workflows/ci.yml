name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lighthouse móvil
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          npm run lighthouse
      - name: Gitleaks (versión fija y checksum verificado)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - name: Validar Nginx y respuesta 404
        run: |
          export PROXY_NETWORK="adpa-ci-${GITHUB_RUN_ID}"
          docker network create "$PROXY_NETWORK"
          trap 'docker compose -f docker-compose.yml -f docker-compose.ci.yml down; docker network rm "$PROXY_NETWORK"' EXIT
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          docker compose exec -T web nginx -t
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 --fail http://127.0.0.1:8080/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-existe)" = 404
          curl -sI http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'none'"
          docker inspect "$(docker compose ps -q web)" > /tmp/container.json
          node scripts/check-container.mjs /tmp/container.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: revision-sitio
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          include-hidden-files: true
