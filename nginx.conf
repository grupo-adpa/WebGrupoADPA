server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # `expires` conserva los encabezados heredados; solo aplica a assets con hash.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    # La ruta limpia existe solo si el build incluyó invue.html.
    location = /invue {
        expires -1;
        try_files /invue.html =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    # El responsable configura /api/* en el proxy, nunca en este sitio.
    location /api/ { return 404; }
    error_page 404 /404.html;
}
