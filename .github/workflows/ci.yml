name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        invue: ["false", "true"]
    env:
      INVUE_ACTIVA: ${{ matrix.invue }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:policy
      - run: npm run test:publication
      - name: Transición de bandera y valor predeterminado
        if: matrix.invue == 'false'
        run: npm run test:invue-build
      - run: npm run build
      - run: node scripts/check-invue.mjs "$INVUE_ACTIVA"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lighthouse móvil
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          npm run lighthouse
      - name: Gitleaks (versión fija y checksum verificado)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - name: Validar Nginx y respuesta 404
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          export PROXY_NETWORK="adpa-ci-${GITHUB_RUN_ID}"
          docker network create "$PROXY_NETWORK"
          trap 'docker compose down; docker network rm "$PROXY_NETWORK"' EXIT
          docker compose build --build-arg INVUE_ACTIVA="$INVUE_ACTIVA"
          docker compose up -d --no-build
          docker compose exec -T web nginx -t
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 --fail http://127.0.0.1:8080/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-existe)" = 404
          curl -sI http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'none'"
          if [ "$INVUE_ACTIVA" = true ]; then
            curl -sI http://127.0.0.1:8080/invue | grep -i "content-security-policy: default-src 'none'"
          fi
          expected=404
          if [ "$INVUE_ACTIVA" = true ]; then expected=200; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/invue)" = "$expected"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/invue.html)" = "$expected"
          docker inspect "$(docker compose ps -q web)" > /tmp/container.json
          node scripts/check-container.mjs /tmp/container.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: revision-sitio-${{ matrix.invue }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
          include-hidden-files: true
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run audit:dev
  quality:
    if: always()
    needs: [variants, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Todos los controles deben pasar
        env:
          VARIANTS_RESULT: ${{ needs.variants.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: test "$VARIANTS_RESULT" = success && test "$AUDIT_RESULT" = success
