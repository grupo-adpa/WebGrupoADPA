name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Lighthouse móvil
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")"
          npm run lighthouse
      - name: Gitleaks (versión fija y checksum verificado)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
      - name: Validar Nginx y respuesta 404
        run: |
          docker build -t web-adpa:ci .
          docker run --rm web-adpa:ci nginx -t
          docker run -d --name web-adpa-test -p 127.0.0.1:8080:80 web-adpa:ci
          trap 'docker stop web-adpa-test' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8080/ -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-existe)" = 404
          curl -sI http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'none'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-sitio
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
